# Thin caller → the org-wide reusable checks (gitleaks + zizmor + actionlint + hygiene).
# The logic lives once in fukuii-project/.github; bump the SHA below to pick up a change there.
# Add this repo's own build/test job below the `checks` job as needed.
#
# NOTE (supply-chain review, 2026-08-21): pinned to an immutable commit rather
# than @main — fukuii-project/.github's main has no branch protection and no tags (verified live
# via the GitHub API), so an unpinned ref here would let anyone with push access to that repo
# change what every seeded repo's CI runs, unreviewed. To bump: resolve the new SHA
# (gh api repos/fukuii-project/.github/commits/main --jq .sha), review the diff at that commit,
# then update both the SHA below and this comment's date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: fukuii-project/.github/.github/workflows/checks.yml@aceddac07800571e8af7d2c2a74b852eb22dc3a8 # main @ 2026-07-18

  # No build job, and that is not an omission left over from seeding: this
  # repository is data. There is nothing here to compile, and the runner that
  # executes these fixtures lives in each consuming client, in its own language
  # and its own CI.
  #
  # What is NOT yet checked here is fixture well-formedness. `check-json` in
  # .pre-commit-config.yaml covers it for anyone who has installed pre-commit,
  # which is a local convention rather than a gate -- a malformed fixture pushed
  # without it reaches main unchallenged. Closing that is a real job (a schema
  # check, not a parse check) and is deliberately not stubbed out here, because a
  # commented-out placeholder reads as a decision already taken.
